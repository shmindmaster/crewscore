[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-guard"
version = "0.1.1"
description = "Structural production-readiness scorecard for AI agent system prompts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sarosh Hussain", email = "sarosh@pendoah.ai" },
]
keywords = ["ai-agents", "guardrails", "evaluation", "llm", "safety", "governance", "production"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agent-guard = "agent_guard.cli:main"

[project.urls]
Homepage = "https://github.com/shmindmaster/agent-guard"
Repository = "https://github.com/shmindmaster/agent-guard"
Issues = "https://github.com/shmindmaster/agent-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
