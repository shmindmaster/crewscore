[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewscore"
version = "0.2.7"
description = "CrewScore — offline structural production-readiness scorecard for AI agent system prompts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sarosh Hussain", email = "sarosh@pendoah.ai" },
]
keywords = [
    "ai-agents",
    "crewscore",
    "guardrails",
    "evaluation",
    "llm",
    "safety",
    "governance",
    "production",
    "scorecard",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
crewscore = "crewscore.cli:main"
# Legacy alias (pre-rename)
agent-guard = "crewscore.cli:main"

[project.urls]
Homepage = "https://crewscore.ai"
Repository = "https://github.com/shmindmaster/crewscore"
Issues = "https://github.com/shmindmaster/crewscore/issues"
Documentation = "https://github.com/shmindmaster/crewscore#readme"

[tool.hatch.build.targets.wheel]
packages = ["crewscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
