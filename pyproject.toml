[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewscore"
version = "0.6.11"
description = "Find the guardrails your AI agent prompt forgot: which of eight failure modes - prompt injection, hallucination, runaway cost, missing human approval and more - the text never guards against. Offline, deterministic, explainable per-rule findings, with a CI gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Sarosh Hussain", email = "sarosh@pendoah.ai" },
]
maintainers = [
    { name = "Sarosh Hussain", email = "sarosh@pendoah.ai" },
]
keywords = [
    "ai-agents",
    "crewscore",
    "guardrails",
    "governance",
    "llm",
    "safety",
    "static-analysis",
    "linter",
    "ci-cd",
    "prompt-engineering",
]
classifiers = [
    # Still Alpha, not Beta: this very release breaks the --json payload
    # shape and `fix` exit codes, three governance dimensions ship with
    # disclosed low validity (docs/validation.md), and browser/product
    # behavior is still evolving. Beta implies the
    # public surface and behavior have settled; this project's contract is
    # still actively changing release to release.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Tests only. action.yml and the release workflow are YAML contracts, and
    # validating them with a real parser is the point: a hand-rolled subset
    # parser would not have caught the unquoted colon that silently turned the
    # action description into a mapping. The shipped package stays
    # dependency-free.
    "pyyaml>=6.0",
]

[project.scripts]
crewscore = "crewscore.cli:main"
# Legacy alias (pre-rename)
agent-guard = "crewscore.cli:main"

[project.urls]
Homepage = "https://crewscore.ai"
Repository = "https://github.com/shmindmaster/crewscore"
Issues = "https://github.com/shmindmaster/crewscore/issues"
Documentation = "https://github.com/shmindmaster/crewscore#readme"

[tool.hatch.build.targets.wheel]
packages = ["crewscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
