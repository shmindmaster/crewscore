[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewscore"
version = "0.4.0"
description = "CrewScore - deterministic offline checker for AI agent prompts and coding-agent config: governance guardrail coverage and configuration smells, with explainable per-rule findings and a CI gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sarosh Hussain", email = "sarosh@pendoah.ai" },
]
keywords = [
    "ai-agents",
    "crewscore",
    "guardrails",
    "governance",
    "llm",
    "safety",
    "static-analysis",
    "linter",
    "ci-cd",
    "prompt-engineering",
]
classifiers = [
    # Still Alpha, not Beta: this very release breaks the --json payload
    # shape and `fix` exit codes, three governance dimensions ship with
    # disclosed low validity (docs/validation.md), and the scoring formula
    # has a known defect tracked for a future release. Beta implies the
    # public surface and behavior have settled; this project's contract is
    # still actively changing release to release.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
crewscore = "crewscore.cli:main"
# Legacy alias (pre-rename)
agent-guard = "crewscore.cli:main"

[project.urls]
Homepage = "https://crewscore.ai"
Repository = "https://github.com/shmindmaster/crewscore"
Issues = "https://github.com/shmindmaster/crewscore/issues"
Documentation = "https://github.com/shmindmaster/crewscore#readme"

[tool.hatch.build.targets.wheel]
packages = ["crewscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
