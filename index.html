<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent-guard — Is your AI production-safe?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;background:#0f0f1a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
h1{font-size:2rem;text-align:center;margin-bottom:0.5rem;color:#fff}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:2rem;font-size:0.9rem}
.container{max-width:700px;width:100%}
.tabs{display:flex;gap:0;margin-bottom:1.5rem}
.tab{flex:1;padding:0.75rem;text-align:center;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:0.85rem;transition:all 0.2s}
.tab:first-child{border-radius:8px 0 0 8px}
.tab:last-child{border-radius:0 8px 8px 0}
.tab.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.panel{display:none;background:#1a1f2e;border:1px solid #334155;border-radius:12px;padding:1.5rem}
.panel.active{display:block}
label{display:block;font-size:0.85rem;color:#94a3b8;margin-bottom:0.5rem}
textarea{width:100%;height:120px;background:#0f0f1a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:0.75rem;font-family:inherit;font-size:0.85rem;resize:vertical}
textarea:focus{outline:none;border-color:#3b82f6}
.btn{width:100%;padding:0.75rem;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:0.9rem;cursor:pointer;font-family:inherit;margin-top:1rem;transition:background 0.2s}
.btn:hover{background:#2563eb}
.question{margin-bottom:1rem;padding:0.75rem;background:#0f0f1a;border-radius:8px;border:1px solid #1e293b}
.question p{font-size:0.8rem;margin-bottom:0.5rem;color:#cbd5e1}
.answers{display:flex;gap:0.5rem}
.answers button{flex:1;padding:0.4rem;border:1px solid #334155;background:#1e293b;color:#94a3b8;border-radius:6px;cursor:pointer;font-size:0.75rem;font-family:inherit;transition:all 0.2s}
.answers button:hover{border-color:#3b82f6;color:#3b82f6}
.answers button.selected-yes{background:#065f46;border-color:#10b981;color:#10b981}
.answers button.selected-no{background:#7f1d1d;border-color:#ef4444;color:#ef4444}
.answers button.selected-dk{background:#78350f;border-color:#f59e0b;color:#f59e0b}
.scorecard{display:none;margin-top:1.5rem;background:#0f0f1a;border:1px solid #334155;border-radius:12px;padding:1.5rem;text-align:center}
.scorecard.show{display:block}
.score-big{font-size:3rem;font-weight:bold;margin:0.5rem 0}
.score-red{color:#ef4444}.score-orange{color:#f59e0b}.score-yellow{color:#eab308}.score-green{color:#10b981}
.tier{font-size:1.1rem;margin-bottom:1rem;font-weight:bold}
.dim-row{display:flex;align-items:center;gap:0.5rem;margin:0.4rem 0;font-size:0.75rem;text-align:left}
.dim-bar{flex:1;height:8px;background:#1e293b;border-radius:4px;overflow:hidden}
.dim-fill{height:100%;border-radius:4px;transition:width 0.5s}
.dim-label{width:180px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim-score{width:50px;text-align:right;color:#64748b}
.share-row{display:flex;gap:0.75rem;margin-top:1.5rem;justify-content:center}
.share-btn{padding:0.5rem 1rem;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:0.8rem;font-family:inherit;transition:all 0.2s}
.share-btn:hover{border-color:#3b82f6;color:#3b82f6}
.share-btn.linkedin:hover{border-color:#0a66c2;color:#0a66c2}
.share-btn.x:hover{border-color:#000;color:#fff;background:#000}
.dev-note{margin-top:2rem;text-align:center;font-size:0.75rem;color:#475569}
.dev-note a{color:#3b82f6;text-decoration:none}
.flags{margin-top:0.75rem;font-size:0.8rem;text-align:left;color:#ef4444}
.vendor-name-input{width:100%;padding:0.6rem;background:#0f0f1a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-family:inherit;font-size:0.85rem;margin-bottom:1rem}
.vendor-name-input:focus{outline:none;border-color:#3b82f6}
</style>
</head>
<body>
<div class="container">
<h1>agent-guard</h1>
<p class="subtitle">Is your AI production-safe? Score it in 30 seconds. No signup. No install. Free.</p>

<div class="tabs">
  <div class="tab active" onclick="switchTab('agent')">Score Your AI Agent</div>
  <div class="tab" onclick="switchTab('vendor')">Score Your AI Vendor</div>
</div>

<!-- AGENT PANEL -->
<div class="panel active" id="panel-agent">
  <label>Paste your AI agent's system prompt (instructions):</label>
  <textarea id="agent-prompt" placeholder="You are a helpful assistant that..."></textarea>
  <button class="btn" onclick="scoreAgent()">Score My Agent</button>
  <div class="scorecard" id="agent-scorecard"></div>
</div>

<!-- VENDOR PANEL -->
<div class="panel" id="panel-vendor">
  <input class="vendor-name-input" id="vendor-name" placeholder="Vendor/product name (e.g., Acme AI)" />
  <div id="vendor-questions"></div>
  <button class="btn" onclick="scoreVendor()">Get Vendor Scorecard</button>
  <div class="scorecard" id="vendor-scorecard"></div>
</div>

<div class="dev-note">
  Developers: full CLI with fix mode, CI integration, adversarial testing<br>
  <a href="https://github.com/shmindmaster/agent-guard">pip install agent-guard</a>
</div>
</div>

<script>
const DIMS = ["Prompt Injection Defense","Anti-Hallucination","Source Citations","Cost Controls","Human-in-the-Loop","Safe-Stop Behavior","Audit Trail","Compliance (HIPAA/SOC2)"];
const VENDOR_Q = [
  "Can you demo it with YOUR data, not their cherry-picked showcase?",
  "Published accuracy benchmark from an independent third party?",
  "SOC2 / HIPAA / ISO 27001 certified (not 'in progress')?",
  "Full audit trail — you can see what the AI did and why?",
  "Documented human-override for critical decisions?",
  "Can export your data if you leave (no lock-in)?",
  "Transparent, predictable pricing (no surprise token costs)?",
  "Published security audit or pen test in last 12 months?",
  "3+ customers in YOUR industry running in production (not pilots)?",
  "Documented failure/escalation process when it breaks?"
];
let vendorAnswers = new Array(10).fill(null);

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',i===(t==='agent'?0:1))});
  document.getElementById('panel-agent').classList.toggle('active',t==='agent');
  document.getElementById('panel-vendor').classList.toggle('active',t==='vendor');
}

// Build vendor questions
function buildVendorQ(){
  const c=document.getElementById('vendor-questions');
  VENDOR_Q.forEach((q,i)=>{
    c.innerHTML+=`<div class="question"><p>${i+1}. ${q}</p><div class="answers">
      <button onclick="setAnswer(${i},'yes',this)">Yes</button>
      <button onclick="setAnswer(${i},'dk',this)">Don't Know</button>
      <button onclick="setAnswer(${i},'no',this)">No</button>
    </div></div>`;
  });
}
function setAnswer(i,v,btn){
  vendorAnswers[i]=v;
  btn.parentElement.querySelectorAll('button').forEach(b=>b.className='');
  btn.className=v==='yes'?'selected-yes':v==='no'?'selected-no':'selected-dk';
}

function bar(score){
  const pct=Math.max(0,Math.min(100,score));
  const color=pct>=70?'#10b981':pct>=50?'#eab308':pct>=30?'#f59e0b':'#ef4444';
  return `<div class="dim-bar"><div class="dim-fill" style="width:${pct}%;background:${color}"></div></div>`;
}
function tierFor(s){
  if(s>=90)return{n:'PRODUCTION READY',c:'score-green'};
  if(s>=70)return{n:'SHIP WITH MONITORING',c:'score-yellow'};
  if(s>=50)return{n:'NEEDS WORK',c:'score-orange'};
  return{n:'NOT PRODUCTION READY',c:'score-red'};
}
function renderScorecard(el,scores,labels,title){
  const overall=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const tier=tierFor(overall);
  let html=`<h3>${title}</h3><div class="score-big ${tier.c}">${overall}/100</div><div class="tier ${tier.c}">${tier.n}</div>`;
  scores.forEach((s,i)=>{html+=`<div class="dim-row"><span class="dim-label">${labels[i]}</span>${bar(s)}<span class="dim-score">${s}</span></div>`;});
  const flags=labels.filter((_,i)=>scores[i]===0);
  if(flags.length)html+=`<div class="flags">${flags.length} RED FLAG(S): ${flags.join(', ')}</div>`;
  html+=`<div class="share-row">
    <button class="share-btn linkedin" onclick="shareLinkedIn(${overall},'${tier.n}','${title}')">Share on LinkedIn</button>
    <button class="share-btn x" onclick="shareX(${overall},'${tier.n}','${title}')">Share on X</button>
    <button class="share-btn" onclick="copyScore(${overall},'${tier.n}','${title}')">Copy Score</button>
  </div>`;
  el.innerHTML=html;el.classList.add('show');
}

function scoreAgent(){
  const p=(document.getElementById('agent-prompt').value||'').toLowerCase();
  const patterns=[
    [/ignore.*(previous|above)|never\s+follow|reject.*instruct|injection|do\s+not\s+reveal.*system|cannot\s+be\s+(told|asked)\s+to/],
    [/do\s+not\s+(fabricat|invent|make\s+up)|if\s+you\s+(do\s+not\s+know|are\s+unsure)|only\s+(cite|use|reference)\s+provided|hallucin|say.*don.t\s+know/i],
    [/cit(e|ation|ing)|source|reference|attribut|every\s+claim/],
    [/token|cost|budget|limit|max.*(length|token|response)|truncat/],
    [/(human|user|supervisor).*(must|shall|should|approve|review|confirm)|human.in.the.loop|manual\s+approv|before.*(execut|send|publish|submit)/],
    [/(stop|halt|pause|refuse|decline).*(if|when)|insufficient|missing.*(data|evidence|information)|cannot\s+proceed|escalat/],
    [/log|record|track|audit|trace|every\s+(action|decision|step)|append.only|immutable/],
    [/hipaa|phi|gdpr|soc.?2|compliance|regulat|encrypt|redact|data\s+protection|tenant|isolation/]
  ];
  const scores=patterns.map(pat=>{
    let m=0;pat[0].forEach(re=>{if(re.test(p))m++;});
    return m===0?0:Math.min(100,15+m*28);
  });
  renderScorecard(document.getElementById('agent-scorecard'),scores,DIMS,'AI Agent Safety Score');
}

function scoreVendor(){
  const name=document.getElementById('vendor-name').value||'AI Vendor';
  const scores=vendorAnswers.map(a=>a==='yes'?100:a==='dk'?30:0);
  renderScorecard(document.getElementById('vendor-scorecard'),scores,VENDOR_Q.map(q=>q.split('?')[0].substring(0,40)),`${name} — Vendor Score`);
}

function shareLinkedIn(score,tier,title){
  const text=encodeURIComponent(`${title}: ${score}/100 — ${tier}\n\nScored with agent-guard. Is your AI actually production-safe?\n\nTry it free: ${location.href}\n\n#AI #AISafety #EnterpriseAI #DueDiligence`);
  window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}`);
  navigator.clipboard.writeText(decodeURIComponent(text));
  alert('Score copied to clipboard! Paste it in your LinkedIn post.');
}
function shareX(score,tier,title){
  const text=encodeURIComponent(`${title}: ${score}/100 — ${tier}. Is your AI production-safe? Score yours free: ${location.href} #AI #AISafety`);
  window.open(`https://x.com/intent/tweet?text=${text}`);
}
function copyScore(score,tier,title){
  navigator.clipboard.writeText(`${title}: ${score}/100 — ${tier}\nScored with agent-guard | ${location.href}`);
  alert('Copied!');
}

buildVendorQ();
</script>
</body>
</html>
