name: CrewScore
description: Structural production-readiness scorecard for AI agent system prompts
author: shmindmaster
branding:
  icon: shield
  color: blue

inputs:
  prompt-file:
    description: Path to a single system prompt file to score (required if scan-path is empty)
    required: false
    default: ""
  scan-path:
    description: Directory/path to scan for agent instruction files via crewscore scan. When set, scores all discovered files and reports the worst (minimum) overall.
    required: false
    default: ""
  threshold:
    description: "Exit non-zero (code 2) if a system prompt scores below this value (0-100). Coding-agent config (AGENTS.md, CLAUDE.md, .cursorrules) is exempt — it is judged on configuration smells, not this number. Use max-smells to gate those."
    required: false
    default: "50"
  max-smells:
    description: "Exit non-zero (code 2) if any file has more than this many configuration smells (arXiv:2606.15828). Leave empty to disable. This is the gate that applies to AGENTS.md-style config files."
    required: false
    default: ""
  explain:
    description: Include matched vs missing guardrail signals (pass "true" to enable)
    required: false
    default: "false"
  summary:
    description: Write transparent markdown summary to this path (also appends to GITHUB_STEP_SUMMARY when set)
    required: false
    default: "crewscore-summary.md"
  pr-comment:
    description: "On pull_request events, post or update a sticky PR comment with the summary (requires pull-requests write permission)"
    required: false
    default: "true"

outputs:
  scored:
    description: "'true' when the run scored at least one system prompt, 'false' when it found only coding-agent config (AGENTS.md, CLAUDE.md, .cursorrules), which is judged on configuration smells rather than a 0-100 score. Guard every use of score/tier on this."
    value: ${{ steps.run.outputs.scored }}
  score:
    description: "Overall structural score (0-100) for the scored system prompt; in scan mode the worst (minimum) overall across system prompts. Coding-agent config is excluded — it is judged on configuration smells, not this number. Empty string when nothing was scored, but GitHub casts '' to 0 in numeric comparisons, so `if: outputs.score < 50` is TRUE for a run that measured nothing and `fromJSON(outputs.score)` errors. Always guard first: if: steps.<id>.outputs.scored == 'true' && ..."
    value: ${{ steps.run.outputs.score }}
  tier:
    description: "Tier label for the score output (e.g. STRUCTURAL: OK WITH GAPS). Empty string when nothing was scored — coding-agent config never sets it. Guard on scored == 'true' before using it."
    value: ${{ steps.run.outputs.tier }}
  summary-path:
    description: Path to the markdown summary file (if written)
    value: ${{ steps.run.outputs.summary-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install CrewScore from action path
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run CrewScore
      id: run
      shell: bash
      run: |
        set -euo pipefail
        PROMPT_FILE="${{ inputs.prompt-file }}"
        SCAN_PATH="${{ inputs.scan-path }}"
        THRESHOLD="${{ inputs.threshold }}"
        MAX_SMELLS="${{ inputs.max-smells }}"
        EXPLAIN="${{ inputs.explain }}"
        SUMMARY="${{ inputs.summary }}"

        if [ -z "$SCAN_PATH" ] && [ -z "$PROMPT_FILE" ]; then
          echo "Either prompt-file or scan-path is required" >&2
          exit 1
        fi

        set +e
        if [ -n "$SCAN_PATH" ]; then
          ARGS=(scan "$SCAN_PATH" --json --threshold "$THRESHOLD")
          if [ -n "$MAX_SMELLS" ]; then
            ARGS+=(--max-smells "$MAX_SMELLS")
          fi
          if [ "$EXPLAIN" = "true" ]; then
            ARGS+=(--explain)
          fi
          if [ -n "$SUMMARY" ]; then
            ARGS+=(--summary "$SUMMARY")
          fi
          OUTPUT=$(crewscore "${ARGS[@]}")
          EXIT=$?
        else
          ARGS=(test --prompt-file "$PROMPT_FILE" --json --threshold "$THRESHOLD")
          if [ -n "$MAX_SMELLS" ]; then
            ARGS+=(--max-smells "$MAX_SMELLS")
          fi
          if [ "$EXPLAIN" = "true" ]; then
            ARGS+=(--explain)
          fi
          if [ -n "$SUMMARY" ]; then
            ARGS+=(--summary "$SUMMARY")
          fi
          OUTPUT=$(crewscore "${ARGS[@]}")
          EXIT=$?
        fi
        set -e
        echo "$OUTPUT"
        if [ -n "$SUMMARY" ] && [ -f "$SUMMARY" ]; then
          echo "Wrote summary markdown: $SUMMARY"
          echo "summary-path=$SUMMARY" >> "$GITHUB_OUTPUT"
        else
          echo "summary-path=" >> "$GITHUB_OUTPUT"
        fi
        # Single-file test JSON: {overall, tier, ...}
        # scan --json: list of {path, overall, tier, ...} — take min overall (worst)
        # over the files actually judged on the governance score. Coding-agent
        # config sits at ~0 by construction and would otherwise set score/tier
        # for the whole repo.
        echo "$OUTPUT" | python -c "
        import json, os, sys
        data = json.load(sys.stdin)
        if isinstance(data, list):
            items = data
        else:
            items = data.get('files') or data.get('results') or [data]
        # governance_applicable is absent on payloads written before profiles
        # existed; everything back then was judged on the score.
        governed = [i for i in items if i.get('governance_applicable', True)]
        if governed:
            worst = min(governed, key=lambda x: int(x['overall']))
            score, tier = worst['overall'], worst['tier']
        else:
            # Nothing here carries a governance grade. Emit empty rather than a
            # 0 that reads as a failing score - but '' is cast to 0 by GitHub in
            # numeric comparisons, so scored= is the flag consumers must guard on.
            # (No backticks anywhere in this block: bash runs command
            # substitution inside the double-quoted python -c argument.)
            score, tier = '', ''
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
            f.write('scored={}\n'.format('true' if governed else 'false'))
            f.write(f'score={score}\n')
            f.write(f'tier={tier}\n')
        "
        exit "$EXIT"

    - name: Sticky PR comment
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.summary-path != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SUMMARY_PATH: ${{ steps.run.outputs.summary-path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ ! -f "$SUMMARY_PATH" ]; then
          echo "No summary file at $SUMMARY_PATH; skip PR comment"
          exit 0
        fi
        if [ -z "${PR_NUMBER:-}" ]; then
          echo "No PR number; skip PR comment"
          exit 0
        fi
        MARKER="<!-- crewscore-sticky -->"
        BODY_FILE=$(mktemp)
        {
          printf '%s\n\n' "$MARKER"
          cat "$SUMMARY_PATH"
        } > "$BODY_FILE"
        # Find existing sticky comment by marker (gh --paginate yields JSON array).
        COMMENT_ID=$(
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          | MARKER="$MARKER" python -c "
        import json, os, sys
        marker = os.environ['MARKER']
        raw = sys.stdin.read().strip()
        comments = []
        if raw:
            try:
                data = json.loads(raw)
                comments = data if isinstance(data, list) else []
            except json.JSONDecodeError:
                # Multiple pages can appear as ][ between arrays.
                fixed = raw.replace('][', ',')
                data = json.loads(fixed)
                comments = data if isinstance(data, list) else []
        for c in comments:
            if marker in (c.get('body') or ''):
                print(c['id'])
                break
        "
        )
        # Prefer raw JSON input for reliable multiline body.
        python -c "
        import json, pathlib, sys
        body = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
        print(json.dumps({'body': body}))
        " "$BODY_FILE" > "${BODY_FILE}.json"
        if [ -n "${COMMENT_ID:-}" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            --input "${BODY_FILE}.json"
          echo "Updated sticky PR comment id=$COMMENT_ID"
        else
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --input "${BODY_FILE}.json"
          echo "Created sticky PR comment"
        fi
        rm -f "$BODY_FILE" "${BODY_FILE}.json"
