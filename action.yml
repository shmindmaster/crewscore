name: CrewScore
description: Find the guardrails your AI agent prompt forgot - injection, hallucination, cost, human approval. Offline, no API key.
author: shmindmaster
branding:
  # GitHub Marketplace closed list (no custom logo). "check-circle" matches
  # written-control coverage better than a generic shield.
  icon: check-circle
  color: green

inputs:
  prompt-file:
    description: Path to a single system prompt file to score (required if scan-path is empty)
    required: false
    default: ""
  scan-path:
    description: Directory/path to scan for agent instruction files via crewscore scan. When set, scores all discovered files and reports the worst (minimum) overall.
    required: false
    default: ""
  threshold:
    description: "Optional legacy numeric gate (0-100). Leave empty for report-only; prefer required-controls or fail-on-regression so an average is never treated as a safety bar. Coding-agent config is exempt."
    required: false
    default: ""
  max-smells:
    description: "Exit non-zero (code 2) if any file has more than this many configuration smells (arXiv:2606.15828). Leave empty to disable. This is the gate that applies to AGENTS.md-style config files."
    required: false
    default: ""
  explain:
    description: Include matched vs missing guardrail signals (pass "true" to enable)
    required: false
    default: "false"
  summary:
    description: Write transparent markdown summary to this path (also appends to GITHUB_STEP_SUMMARY when set)
    required: false
    default: "crewscore-summary.md"
  pr-comment:
    description: "On pull_request events, post or update a sticky PR comment with the summary (requires pull-requests write permission)"
    required: false
    default: "true"
  required-controls:
    description: "Comma-separated public control IDs or dimensions that must be present (for example human_gate.approval_required,safe_stop)."
    required: false
    default: ""
  forbid-missing:
    description: "Comma-separated public control IDs or dimensions that must not be missing."
    required: false
    default: ""
  baseline:
    description: "Path to a prompt-free baseline JSON from crewscore baseline."
    required: false
    default: ""
  fail-on-regression:
    description: "When true, fail only if a control recorded in baseline disappears."
    required: false
    default: "false"
  config:
    description: "Optional .crewscore.yml policy configuration."
    required: false
    default: ""
  sarif:
    description: "Optional path for prompt-free SARIF 2.1.0 missing-control findings."
    required: false
    default: ""

outputs:
  scored:
    description: "'true' when the run scored at least one system prompt, 'false' when it found only coding-agent config (AGENTS.md, CLAUDE.md, .cursorrules), which is judged on configuration smells rather than a 0-100 score. Guard every use of score/tier on this. If crewscore crashes (emits non-JSON), the step dies under `set -euo pipefail` before writing any output, so scored is the empty string — neither 'true' nor 'false'. Use `scored == 'true'`, which fails safe on that empty string; a bare `if: outputs.scored` or `scored == 'false'` would misread it, since GitHub treats the non-empty string 'false' as truthy."
    value: ${{ steps.run.outputs.scored }}
  score:
    description: "Overall structural score (0-100) for the scored system prompt; in scan mode the worst (minimum) overall across system prompts. Coding-agent config is excluded — it is judged on configuration smells, not this number. Empty string when nothing was scored, but GitHub casts '' to 0 in numeric comparisons, so `if: outputs.score < 50` is TRUE for a run that measured nothing and `fromJSON(outputs.score)` errors. Always guard first: if: steps.<id>.outputs.scored == 'true' && ..."
    value: ${{ steps.run.outputs.score }}
  tier:
    description: "Tier label for the score output (e.g. STRUCTURAL: OK WITH GAPS). Empty string when nothing was scored — coding-agent config never sets it. Guard on scored == 'true' before using it."
    value: ${{ steps.run.outputs.tier }}
  summary-path:
    description: Path to the markdown summary file (if written)
    value: ${{ steps.run.outputs.summary-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install CrewScore from action path
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run CrewScore
      id: run
      shell: bash
      env:
        PROMPT_FILE: ${{ inputs.prompt-file }}
        SCAN_PATH: ${{ inputs.scan-path }}
        THRESHOLD: ${{ inputs.threshold }}
        MAX_SMELLS: ${{ inputs.max-smells }}
        EXPLAIN: ${{ inputs.explain }}
        SUMMARY: ${{ inputs.summary }}
        REQUIRED_CONTROLS: ${{ inputs.required-controls }}
        FORBID_MISSING: ${{ inputs.forbid-missing }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        CONFIG: ${{ inputs.config }}
        SARIF: ${{ inputs.sarif }}
      run: |
        set -euo pipefail

        if [ -z "$SCAN_PATH" ] && [ -z "$PROMPT_FILE" ]; then
          echo "Either prompt-file or scan-path is required" >&2
          exit 1
        fi

        set +e
        if [ -n "$SCAN_PATH" ]; then
          ARGS=(scan "$SCAN_PATH" --json)
          if [ -n "$THRESHOLD" ]; then
            ARGS+=(--threshold "$THRESHOLD")
          fi
          if [ -n "$MAX_SMELLS" ]; then
            ARGS+=(--max-smells "$MAX_SMELLS")
          fi
          if [ "$EXPLAIN" = "true" ]; then
            ARGS+=(--explain)
          fi
          if [ -n "$SUMMARY" ]; then
            ARGS+=(--summary "$SUMMARY")
          fi
          if [ -n "$REQUIRED_CONTROLS" ]; then ARGS+=(--require "$REQUIRED_CONTROLS"); fi
          if [ -n "$FORBID_MISSING" ]; then ARGS+=(--forbid-missing "$FORBID_MISSING"); fi
          if [ -n "$BASELINE" ]; then ARGS+=(--baseline "$BASELINE"); fi
          if [ "$FAIL_ON_REGRESSION" = "true" ]; then ARGS+=(--fail-on-regression); fi
          if [ -n "$CONFIG" ]; then ARGS+=(--config "$CONFIG"); fi
          if [ -n "$SARIF" ]; then ARGS+=(--sarif "$SARIF"); fi
          OUTPUT=$(crewscore "${ARGS[@]}")
          EXIT=$?
        else
          ARGS=(test --prompt-file "$PROMPT_FILE" --json)
          if [ -n "$THRESHOLD" ]; then
            ARGS+=(--threshold "$THRESHOLD")
          fi
          if [ -n "$MAX_SMELLS" ]; then
            ARGS+=(--max-smells "$MAX_SMELLS")
          fi
          if [ "$EXPLAIN" = "true" ]; then
            ARGS+=(--explain)
          fi
          if [ -n "$SUMMARY" ]; then
            ARGS+=(--summary "$SUMMARY")
          fi
          # Values come from env rather than command text, so consumer inputs
          # remain literal even if they contain shell metacharacters.
          if [ -n "$REQUIRED_CONTROLS" ]; then ARGS+=(--require "$REQUIRED_CONTROLS"); fi
          if [ -n "$FORBID_MISSING" ]; then ARGS+=(--forbid-missing "$FORBID_MISSING"); fi
          if [ -n "$BASELINE" ]; then ARGS+=(--baseline "$BASELINE"); fi
          if [ "$FAIL_ON_REGRESSION" = "true" ]; then ARGS+=(--fail-on-regression); fi
          if [ -n "$CONFIG" ]; then ARGS+=(--config "$CONFIG"); fi
          if [ -n "$SARIF" ]; then ARGS+=(--sarif "$SARIF"); fi
          OUTPUT=$(crewscore "${ARGS[@]}")
          EXIT=$?
        fi
        set -e
        echo "$OUTPUT"
        if [ -n "$SUMMARY" ] && [ -f "$SUMMARY" ]; then
          echo "Wrote summary markdown: $SUMMARY"
          echo "summary-path=$SUMMARY" >> "$GITHUB_OUTPUT"
        else
          echo "summary-path=" >> "$GITHUB_OUTPUT"
        fi
        # Single-file test JSON: {overall, tier, ...}
        # scan --json: list of {path, overall, tier, ...} — take min overall (worst)
        # over the files actually judged on the governance score. Coding-agent
        # config sits at ~0 by construction and would otherwise set score/tier
        # for the whole repo.
        echo "$OUTPUT" | python -c "
        import json, os, sys
        data = json.load(sys.stdin)
        if isinstance(data, list):
            items = data
        else:
            items = data.get('files') or data.get('results') or [data]
        # governance_applicable is absent on payloads written before profiles
        # existed; everything back then was judged on the score.
        governed = [i for i in items if i.get('governance_applicable', True)]
        if governed:
            worst = min(governed, key=lambda x: int(x['overall']))
            score, tier = worst['overall'], worst['tier']
        else:
            # Nothing here carries a governance grade. Emit empty rather than a
            # 0 that reads as a failing score - but '' is cast to 0 by GitHub in
            # numeric comparisons, so scored= is the flag consumers must guard on.
            # (No backticks anywhere in this block: bash runs command
            # substitution inside the double-quoted python -c argument.)
            score, tier = '', ''
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
            f.write('scored={}\n'.format('true' if governed else 'false'))
            f.write(f'score={score}\n')
            f.write(f'tier={tier}\n')
        # Gate failures become file-level annotations so the reason a check
        # went red is visible on the PR itself, not only in the raw log.
        for item in items:
            details = item.get('policy') or {}
            path = item.get('path') or 'the prompt'
            props = f' file={path}' if item.get('path') else ''
            props = f'{props},title=CrewScore' if props else ' title=CrewScore'
            for control in details.get('missing_required_controls') or []:
                print(f'::error{props}::Required control {control} not found in '
                      f'{path}. Add the missing wording or adjust required-controls.')
            for control in details.get('regressed_controls') or []:
                print(f'::error{props}::Control {control} was in the baseline '
                      f'but is gone from {path}.')
        "
        exit "$EXIT"

    - name: Sticky PR comment
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.summary-path != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SUMMARY_PATH: ${{ steps.run.outputs.summary-path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ ! -f "$SUMMARY_PATH" ]; then
          echo "No summary file at $SUMMARY_PATH; skip PR comment"
          exit 0
        fi
        if [ -z "${PR_NUMBER:-}" ]; then
          echo "No PR number; skip PR comment"
          exit 0
        fi
        MARKER="<!-- crewscore-sticky -->"
        BODY_FILE=$(mktemp)
        {
          printf '%s\n\n' "$MARKER"
          cat "$SUMMARY_PATH"
        } > "$BODY_FILE"
        # A missing pull-requests:write permission (or a fork PR's read-only
        # token) must degrade to a warning, not fail an otherwise-green check:
        # the scan already ran and the summary is in the job summary.
        PERMISSION_HINT="CrewScore could not post the sticky PR comment (no pull-requests write permission - fork PRs always run with a read-only token). The summary is still in the job summary. To enable comments on same-repo PRs, add 'permissions: pull-requests: write' to the job, or set pr-comment: 'false' to silence this warning."
        # Find existing sticky comment by marker (gh --paginate yields JSON array).
        if ! COMMENTS_JSON=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate 2>&1); then
          echo "::warning title=CrewScore PR comment skipped::${PERMISSION_HINT}"
          echo "$COMMENTS_JSON"
          rm -f "$BODY_FILE"
          exit 0
        fi
        COMMENT_ID=$(
          printf '%s' "$COMMENTS_JSON" \
          | MARKER="$MARKER" python -c "
        import json, os, sys
        marker = os.environ['MARKER']
        raw = sys.stdin.read().strip()
        comments = []
        if raw:
            try:
                data = json.loads(raw)
                comments = data if isinstance(data, list) else []
            except json.JSONDecodeError:
                # Multiple pages can appear as ][ between arrays.
                fixed = raw.replace('][', ',')
                data = json.loads(fixed)
                comments = data if isinstance(data, list) else []
        for c in comments:
            if marker in (c.get('body') or ''):
                print(c['id'])
                break
        "
        )
        # Prefer raw JSON input for reliable multiline body.
        python -c "
        import json, pathlib, sys
        body = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
        print(json.dumps({'body': body}))
        " "$BODY_FILE" > "${BODY_FILE}.json"
        if [ -n "${COMMENT_ID:-}" ]; then
          if gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            --input "${BODY_FILE}.json" > /dev/null; then
            echo "Updated sticky PR comment id=$COMMENT_ID"
          else
            echo "::warning title=CrewScore PR comment skipped::${PERMISSION_HINT}"
          fi
        else
          if gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --input "${BODY_FILE}.json" > /dev/null; then
            echo "Created sticky PR comment"
          else
            echo "::warning title=CrewScore PR comment skipped::${PERMISSION_HINT}"
          fi
        fi
        rm -f "$BODY_FILE" "${BODY_FILE}.json"
