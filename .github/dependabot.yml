version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
  # Workflow steps are pinned to immutable commit SHAs with the tag recorded in
  # an adjacent `# vX.Y.Z` comment. Dependabot reads that comment, so it can
  # propose SHA bumps for privileged and unprivileged actions alike while
  # keeping the human-readable version current - the reviewable update path
  # that makes SHA pinning sustainable instead of a frozen liability.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
