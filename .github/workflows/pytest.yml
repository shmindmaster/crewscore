name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Routine validation stays on the existing DigitalOcean runner fleet.
    # Never execute untrusted PR code (forks, bots, or collaborators) on a
    # persistent self-hosted machine. Maintainer-owned PRs are the only PRs
    # permitted onto this runner.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, Linux, X64, sh-runner, docker]
    timeout-minutes: 30
    strategy:
      # One runner is allocated to CrewScore, so run the supported Python
      # versions deliberately rather than queuing concurrent jobs on it.
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  browser:
    name: browser tests
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, Linux, X64, sh-runner, docker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser test dependencies
        run: npm ci --include=dev
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        # The shared DigitalOcean host has one runner. Serialize Playwright so
        # Firefox/WebKit do not contend for its browser resources; all browser
        # projects still run on every non-deploying validation pass.
        run: npm run test:web -- --workers=1
