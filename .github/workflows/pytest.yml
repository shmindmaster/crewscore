name: pytest

on:
  push:
    branches: [main]
  pull_request:
  # Squash auto-merge is enabled with GITHUB_TOKEN, and pushes made with that
  # token do not start workflows, so `push: main` never fires after an
  # auto-merged PR. Dispatch this workflow on main to test the exact merged SHA.
  workflow_dispatch:

# Everything runs on ephemeral GitHub-hosted runners. This repository is
# public, so hosted minutes are free and unmetered, and an ephemeral machine
# can safely execute fork and bot PRs. That removes the maintainer-only guard
# these jobs used to need to keep untrusted code off a persistent host, and
# with it the duplicated "(hosted, untrusted PRs)" jobs that existed solely to
# give outside contributors reduced coverage. Every PR now gets the same full
# matrix.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  minimum-dependencies:
    name: minimum supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install declared dependency floors
        run: |
          pip install -e . --no-deps
          pip install "click==8.0.0" "rich==13.0.0" "pytest==8.0.0" "pyyaml==6.0"
      - name: Test prompt-free CLI output contracts at dependency floors
        run: pytest -q tests/test_prompt_free_outputs.py

  dependency-audit:
    name: runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # Audit exactly what `pip install crewscore` puts on a user's machine:
      # freeze the runtime closure first, then audit that list, so the
      # auditor's own dependencies are not part of the result.
      - name: Resolve the runtime dependency closure
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install --quiet .
          /tmp/runtime/bin/pip freeze --exclude crewscore > runtime-requirements.txt
          cat runtime-requirements.txt
      - name: Audit runtime dependencies
        run: |
          python -m pip install --quiet "pip-audit==2.10.1"
          python -m pip_audit --requirement runtime-requirements.txt --no-deps --disable-pip --progress-spinner off

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
      - name: Install browser test dependencies
        run: npm ci --include=dev
      - name: Run merge-controller tests
        run: npm run test:automerge
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:web
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
