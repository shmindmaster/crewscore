name: pytest

on:
  push:
    branches: [main]
  pull_request:

# Everything runs on ephemeral GitHub-hosted runners. This repository is
# public, so hosted minutes are free and unmetered, and an ephemeral machine
# can safely execute fork and bot PRs. That removes the maintainer-only guard
# these jobs used to need to keep untrusted code off a persistent host, and
# with it the duplicated "(hosted, untrusted PRs)" jobs that existed solely to
# give outside contributors reduced coverage. Every PR now gets the same full
# matrix.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install browser test dependencies
        run: npm ci --include=dev
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:web
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
