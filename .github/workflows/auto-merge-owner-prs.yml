# Base-owned machine merge gate for maintainer-owned same-repo PRs.
#
# Human review is NOT required. Required status checks on `main` are the gate:
#   test (3.11), test (3.12), test (3.13), browser tests, selftest
#
# The workflow enables squash auto-merge while checks are pending. It never
# performs a direct merge: GitHub cannot atomically bind a merge to label or
# draft state, so an already-clean PR is left for an explicit merge decision.
name: Auto-merge owner PRs

on:
  # This workflow has write permissions, so it must be loaded from the base
  # branch. pull_request would let the PR rewrite its own privileged wrapper.
  pull_request_target:
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review, labeled, unlabeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  # A stop event must queue behind any in-flight arming mutation and then
  # withdraw it. Canceling the running reconciliation can lose that withdrawal.
  cancel-in-progress: false

jobs:
  enable-automerge:
    # Structural admission only: owner-authored, same-repo head. Who SENT the
    # event is decided inside the controller, because a non-owner event (a
    # collaborator's push, anyone applying no-automerge) must still run -- to
    # withdraw an armed request, never to arm one. A skipped job cannot revoke.
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The only checkout is the immutable base revision. This privileged job
      # never checks out or executes pull-request code.
      - name: Check out auto-merge controller from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .github-base
          persist-credentials: false

      - name: Reconcile protected squash auto-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const controllerPath = path.join(
              process.env.GITHUB_WORKSPACE,
              ".github-base/.github/scripts/owner-automerge.js"
            );
            if (!fs.existsSync(controllerPath)) {
              throw new Error(
                "Auto-merge controller missing from the base revision; refusing to act."
              );
            }
            const controller = require(controllerPath);
            await controller.enableOrMergeOwnerPr({
              github,
              core,
              pr: context.payload.pull_request,
              // Rollout compatibility: the protected-base controller can be
              // one revision behind this wrapper. These fail-closed event
              // inputs keep that controller safe; the current controller
              // ignores optOut and independently queries fresh state.
              optOut: ${{ contains(github.event.pull_request.labels.*.name, 'no-automerge') }},
              repositoryOwner: context.repo.owner,
              repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
              trustedSender: ${{ github.event.sender.login == github.repository_owner && github.event.pull_request.draft == false }},
            });
