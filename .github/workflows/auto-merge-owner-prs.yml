# Machine merge gate for maintainer-owned same-repo PRs.
#
# Human review is NOT required. Required status checks on `main` are the gate:
#   test (3.11), test (3.12), test (3.13), browser tests, selftest
#
# The workflow enables squash auto-merge while checks are pending. If GitHub
# reports the PR already clean, it squash-merges at the exact expected head.
# Both paths remain subject to the required checks and branch ruleset.
name: Auto-merge owner PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    # Only maintainer PRs from this repo (same trust boundary as pytest runners).
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Confused deputy: the controller below decides whether this PR gets
      # auto-merged, so it must never come from the PR. Reading it from the
      # base revision means a PR can only change the merge controller after
      # that change is merged, reviewed, and protected by the branch ruleset.
      #
      # The path is written after the PR checkout on purpose: checkout into a
      # subdirectory cannot shadow or be shadowed by PR content once it runs
      # second, and persist-credentials: false leaves no token in .git/config
      # for anything in either tree to read.
      - name: Check out auto-merge controller from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .github-base
          persist-credentials: false

      - name: Enable or complete protected squash merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const controllerPath = path.join(
              process.env.GITHUB_WORKSPACE,
              ".github-base/.github/scripts/owner-automerge.js"
            );
            if (!fs.existsSync(controllerPath)) {
              throw new Error(
                "Auto-merge controller missing from the base revision; refusing to act."
              );
            }
            const controller = require(controllerPath);
            await controller.enableOrMergeOwnerPr({
              github,
              core,
              pr: context.payload.pull_request,
            });
