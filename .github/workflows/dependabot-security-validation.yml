# Dependabot may update dependencies that execute during installation. Keep
# those PRs off the persistent DigitalOcean runner, while still validating the
# same published CLI, browser, and Action contracts before a maintainer merges.
name: Dependabot security validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Install browser dependencies
        run: npm ci --include=dev
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test CLI and browser contracts
        run: |
          pytest -q
          npm run test:web -- --workers=1
      - name: Smoke-test the composite Action
        id: score
        uses: ./
        with:
          prompt-file: examples/sample-prompt.md
          threshold: "0"
      - name: Assert Action output
        run: |
          test -n "${{ steps.score.outputs.score }}"
          test -n "${{ steps.score.outputs.tier }}"
