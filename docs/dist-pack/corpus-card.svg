<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">CrewScore: production median 10, GPT-Store median 0</title>
  <desc id="desc">written-control coverage — not runtime proof. Production agents n=83 median 10/100; GPT-Store prompts n=273 median 0/100. Cliff's delta = 0.614.</desc>
  <defs>
    <style>
      .bg { fill: #0f0f1a; }
      .panel { fill: #1a1f2e; stroke: #334155; stroke-width: 1; }
      .t { font-family: Consolas, 'SF Mono', 'Liberation Mono', Menlo, monospace; }
      .white { fill: #ffffff; }
      .muted { fill: #94a3b8; }
      .dim { fill: #64748b; }
      .amber { fill: #f59e0b; }
      .red { fill: #ef4444; }
      .track { fill: #1e293b; }
      .bar-prod { fill: #f59e0b; }
      .bar-gpt { fill: #64748b; }
    </style>
  </defs>
  <rect class="bg" width="800" height="420" rx="16"/>
  <rect class="panel" x="28" y="28" width="744" height="364" rx="12"/>

  <text class="t white" x="56" y="78" font-size="28" font-weight="700">CrewScore</text>
  <text class="t muted" x="56" y="108" font-size="15">Coverage on real agent prompts</text>
  <text class="t dim" x="56" y="132" font-size="13">written-control coverage — not runtime proof</text>

  <!-- Production column -->
  <text class="t muted" x="56" y="180" font-size="14">Production agents</text>
  <text class="t amber" x="56" y="250" font-size="64" font-weight="700">10</text>
  <text class="t dim" x="56" y="278" font-size="14">/100 median  ·  n=83</text>
  <rect class="track" x="56" y="296" width="280" height="10" rx="4"/>
  <rect class="bar-prod" x="56" y="296" width="28" height="10" rx="4"/>

  <!-- GPT-Store column -->
  <text class="t muted" x="420" y="180" font-size="14">GPT-Store prompts</text>
  <text class="t red" x="420" y="250" font-size="64" font-weight="700">0</text>
  <text class="t dim" x="420" y="278" font-size="14">/100 median  ·  n=273</text>
  <rect class="track" x="420" y="296" width="280" height="10" rx="4"/>
  <rect class="bar-gpt" x="420" y="296" width="2" height="10" rx="4"/>

  <text class="t muted" x="56" y="350" font-size="14">Cliff's delta = 0.614  ·  n=83 vs n=273</text>
  <text class="t dim" x="56" y="382" font-size="12">crewscore-hygiene@0.6.0  ·  https://crewscore.ai</text>
</svg>
