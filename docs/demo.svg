<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">CrewScore demo</title>
  <desc id="desc">A bare prompt states none of the eight governance controls. Running crewscore fix raises coverage to 50 of 100, and CrewScore flags its own output as template boilerplate.</desc>
  <defs>
    <style>
      .bg { fill: #0f0f1a; }
      .panel { fill: #1a1f2e; stroke: #334155; }
      .t { font-family: Consolas, 'SF Mono', monospace; fill: #e2e8f0; }
      .dim { font-size: 13px; fill: #94a3b8; }
      .muted { font-size: 12px; fill: #64748b; }
      .warn { font-size: 12px; fill: #f59e0b; }
      .title { font-size: 16px; font-weight: 700; fill: #fff; }
      .big { font-size: 42px; font-weight: 700; }
      .red { fill: #ef4444; }
      .amber { fill: #f59e0b; }
      .barbg { fill: #1e293b; }
      .bar { fill: #ef4444; }
      .bar2 { fill: #f59e0b; }
    </style>
  </defs>
  <rect class="bg" width="720" height="400" rx="12"/>
  <rect class="panel" x="24" y="24" width="672" height="352" rx="12"/>

  <!-- BEFORE -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
    <text class="t title" x="48" y="64">crewscore test - guardrail coverage</text>
    <text class="t muted" x="48" y="88">prompt: "You are a helpful assistant."</text>
    <text class="t big red" x="48" y="150">0/100</text>
    <text class="t red" x="48" y="178">STRUCTURAL: CRITICAL GAPS</text>
    <text class="t dim" x="48" y="220">Injection . Hallucination . Citation . Cost . HITL . Stop . Audit . Compliance</text>
    <rect class="barbg" x="48" y="240" width="600" height="10" rx="4"/>
    <text class="t muted" x="48" y="282">0 of 8 controls stated. This measures what the text says,</text>
    <text class="t muted" x="48" y="300">not whether the agent obeys it.</text>
    <text class="t muted" x="48" y="336">pip install crewscore  .  crewscore.ai</text>
  </g>

  <!-- AFTER -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
    <text class="t title" x="48" y="64">crewscore fix --apply - templates appended</text>
    <text class="t muted" x="48" y="88">same prompt, guardrail language added</text>
    <text class="t big amber" x="48" y="150">50/100</text>
    <text class="t amber" x="48" y="178">STRUCTURAL: WEAK  (+50)</text>
    <text class="t dim" x="48" y="220">Injection . Hallucination . Citation . Cost . HITL . Stop . Audit . Compliance</text>
    <rect class="barbg" x="48" y="240" width="600" height="10" rx="4"/>
    <rect class="bar2" x="48" y="240" width="300" height="10" rx="4"/>
    <text class="t warn" x="48" y="282">warning: template_boilerplate_detected</text>
    <text class="t muted" x="48" y="300">The score went up. CrewScore is telling you the increase is filler.</text>
    <text class="t muted" x="48" y="336">Coverage, not quality - see docs/validation.md</text>
  </g>
</svg>
